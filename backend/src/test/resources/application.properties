# Test overrides.
#
# NOTE: this file REPLACES src/main/resources/application.properties for tests
# (same classpath name), so anything the context needs at startup must be repeated
# here — notably the datasource, or contextLoads() fails with
# "Failed to determine a suitable driver class".

# JwtService refuses to start on the built-in dev secret; tests are not production,
# so allow it explicitly rather than requiring a JWT_SECRET in CI.
app.allow-insecure-jwt-secret=true

# Datasource: tests never reach a real database, but the context still builds the
# DataSource/EntityManagerFactory beans. Point at an unopened MySQL URL and let
# Hikari fail lazily rather than at startup.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ritgate_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:test}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Don't block startup trying to reach a DB that isn't there.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=0
spring.sql.init.mode=never

# Entities are mapped against an existing schema; never let tests emit DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
